name: Propose new news posts

on:
  schedule:
    - cron: "30 3 * * 1"   # every Monday, 09:00 IST
  workflow_dispatch:        # "Run workflow" button in the Actions tab

permissions:
  contents: write
  pull-requests: write

jobs:
  fetch:
    # Only the primary repository runs this; the mirror just receives its results.
    if: github.repository == 'soorajkprabha/vast-sdg'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the feeds and propose new posts
        run: python3 scripts/fetch_news.py | tee fetch.log
      - name: Open or update the review pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain data)" ]; then echo "No new posts."; exit 0; fi
          git config user.name "vast-sdg-bot"
          git config user.email "vast-sdg-bot@users.noreply.github.com"
          git checkout -B news-update
          git add data
          git commit -m "Propose new News & Events posts for review"
          git push -f origin news-update
          if [ "$(gh pr list --head news-update --state open --json number --jq length)" = "0" ]; then
            gh pr create --base main --head news-update \
              --title "New News & Events posts to review" \
              --body "New posts were found on the college news portal. They are hidden on the site until approved. In data/activities.json, check each entry marked \"verified\": false: correct the SDG numbers, then change it to true (or delete the entry if it is not an SDG activity). Merge when done."
          fi
